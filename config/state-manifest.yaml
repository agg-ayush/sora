never_carry:
  - "*.lock"
  - "*.pid"
  - "*.sock"
  - "__pycache__"
  - "state-staging"
  - "state-restore-backups"

secret_globs:
  - ".env*"
  - "*.env"
  - "auth.json*"
  - ".credentials*"
  - "credentials*"
  - "*.key"
  - "*.pem"
  - "*.p12"
  - ".netrc"
  - "mcp-tokens"
  - "secrets"
  - ".claude.json*"
  - "settings.json*"
  - "settings.local.json*"
  - "config.yaml*"
  - "*.zip"
  - "*.tar"
  - "*.tar.*"
  - "*.tgz"
  - "*.gpg"

