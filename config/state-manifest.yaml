# Host-state manifest: classifies every top-level entry of the hermes, claude and smem roots.
# The first matching rule wins, so secret rules sit before the wider ones.
version: 1

rules:
  - {root: hermes, match: "*.lock", class: host-local}
  - {root: hermes, match: "*.pid", class: host-local}
  - {root: hermes, match: "*.sock", class: host-local}
  - {root: hermes, match: "*.db-wal", class: host-local}
  - {root: hermes, match: "*.db-shm", class: host-local}
  - {root: hermes, match: "*.db-journal", class: host-local}
  - {root: claude, match: "*.lock", class: host-local}
  - {root: claude, match: "*.pid", class: host-local}
  - {root: claude, match: "*.sock", class: host-local}
  - {root: hermes, match: "state-staging", class: host-local}
  - {root: hermes, match: "state-restore-backups", class: host-local}
  - {root: smem, match: "*.lock", class: host-local}
  - {root: smem, match: "*.pid", class: host-local}
  - {root: smem, match: "*.sock", class: host-local}
  - {root: smem, match: "smem.db-wal", class: host-local}
  - {root: smem, match: "smem.db-shm", class: host-local}
  - {root: smem, match: "sessions", class: host-local}
  - {root: hermes, match: ".env*", class: secret}
  - {root: hermes, match: "config.yaml*", class: secret}
  - {root: hermes, match: "auth.json*", class: secret}
  - {root: hermes, match: "mcp-tokens", class: secret}
  - {root: hermes, match: "secrets", class: secret}
  - {root: hermes, match: ".credentials*", class: secret}
  - {root: hermes, match: "credentials*", class: secret}
  - {root: hermes, match: "backups", class: secret}
  - {root: hermes, match: ".curator_backups", class: secret}
  - {root: hermes, match: "state-snapshots", class: secret}
  - {root: claude, match: "settings.json*", class: secret}
  - {root: claude, match: "settings.local.json*", class: secret}
  - {root: claude, match: ".credentials*", class: secret}
  - {root: claude, match: "backups", class: secret}
  - {root: hermes, match: "agent-hooks", class: repo-managed}
  - {root: hermes, match: "cron", class: platform-specific, platform: gateway, carry: true}
  - {root: hermes, match: "pairing", class: platform-specific, platform: gateway, carry: true}
  - {root: hermes, match: "platforms", class: platform-specific, platform: gateway, carry: true}
  - {root: hermes, match: "gateway_state.json", class: platform-specific, platform: gateway, carry: true}
  - {root: hermes, match: "channel_directory.json", class: platform-specific, platform: gateway, carry: true}
  - {root: hermes, match: "skills", class: personal-state}
  - {root: hermes, match: "plugins", class: personal-state}
  - {root: hermes, match: "scripts", class: personal-state}
  # Retain the legacy isolated Claude config path so existing user state still migrates.
  - {root: hermes, match: "claude-seatbelt-config", class: personal-state}
  - {root: hermes, match: "claude-k3-config", class: personal-state}
  - {root: hermes, match: "claude-opus55-cli", class: personal-state}
  - {root: hermes, match: "memories", class: personal-state}
  - {root: hermes, match: "SOUL.md*", class: personal-state}
  - {root: hermes, match: "hooks", class: personal-state}
